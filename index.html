<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シャドーボックスを作る</title>
<meta name="description" content="画像を層に切り分けて、立体のシャドーボックスとして眺めるツール">
<style>
  :root{
    --wall:#e4dfd3; --wall-edge:#cbc4b4; --ink:#2a2233; --ink-soft:#655b6e;
    --panel:#f4f0e7; --panel-2:#fffdf8; --line:rgba(42,34,51,.18); --gold:#946f1f; --on-gold:#fffdf8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme:dark;
      --wall:#1d1824; --wall-edge:#110e16; --ink:#ece6d8; --ink-soft:#a79fb0;
      --panel:#241e2c; --panel-2:#2e2738; --line:rgba(236,230,216,.18); --gold:#d0aa55; --on-gold:#1d1824;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--panel); color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    font-size:15px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  button,select,input{font:inherit;color:inherit}
  button{
    min-height:40px; padding:0 14px; border:1px solid var(--line); border-radius:8px;
    background:var(--panel-2); cursor:pointer; white-space:nowrap;
  }
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
  button:disabled{opacity:.4;cursor:default}
  select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:0 8px}
  input[type=range]{accent-color:var(--gold);min-width:0}

  .top{
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    padding-top:max(8px,env(safe-area-inset-top)); border-bottom:1px solid var(--line);
  }
  .top h1{font-size:16px;font-weight:600;letter-spacing:.08em;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:560px){ .top h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} .top{justify-content:space-between} }
  .tabs{display:flex}
  .tabs button{border-radius:0}
  .tabs button:first-child{border-radius:8px 0 0 8px}
  .tabs button:last-child{border-radius:0 8px 8px 0;border-left:0}

  main{flex:1;min-height:0;display:flex}
  .pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
  body[data-view="edit"] #view3d{display:none}
  body[data-view="box"] #edit{display:none}
  @media (min-width:900px){
    body[data-view] #edit, body[data-view] #view3d{display:flex}
    #edit{border-right:1px solid var(--line);max-width:520px}
    .tabs{display:none}
  }

  /* 切り分け */
  .canvas-wrap{flex:1;min-height:120px;position:relative;background:var(--wall-edge)}
  #paint{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .tools{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:center}
  .seg{display:flex}
  .seg button{border-radius:0;padding:0 13px}
  .seg button:first-child{border-radius:8px 0 0 8px}
  .seg button+button{border-left:0}
  .seg button:last-child{border-radius:0 8px 8px 0}
  .amount{display:flex;align-items:center;gap:8px;flex:1;min-width:150px}
  .amount input{flex:1}
  .hint{margin:0;padding:0 12px 6px;font-size:13px;color:var(--ink-soft)}
  .layers{
    border-top:1px solid var(--line); overflow-y:auto; max-height:34vh; flex:none;
    padding:6px 12px max(8px,env(safe-area-inset-bottom));
  }
  .layers-head{display:flex;align-items:center;gap:8px;padding:4px 0 6px}
  .layers-head span{flex:1;font-size:13px;color:var(--ink-soft)}
  .row{
    display:flex;align-items:center;gap:8px;padding:4px 6px;border:1px solid transparent;border-radius:8px;
  }
  .row.active{border-color:var(--gold);background:var(--panel-2)}
  .row .pick{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0 4px;text-align:left;min-width:0}
  .sw{width:18px;height:18px;border-radius:4px;flex:none;border:1px solid var(--line)}
  .row .mini{min-height:36px;width:38px;padding:0}
  .row.base{color:var(--ink-soft);padding:8px 10px}

  /* 立体 */
  #view3d{background:radial-gradient(120% 90% at 50% 38%, var(--wall) 0%, var(--wall-edge) 100%)}
  .stage-wrap{flex:1;min-height:0;position:relative}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .gapbar{display:flex;align-items:center;gap:12px;padding:10px 16px max(10px,env(safe-area-inset-bottom));justify-content:center}
  .gapbar input{width:min(50vw,220px)}
  #err{display:none;padding:24px;text-align:center;line-height:1.8}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body data-view="edit">
<header class="top">
  <h1>シャドーボックスを作る</h1>
  <button id="openBtn">画像を選ぶ</button>
  <input id="file" type="file" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
  <div class="tabs" role="group" aria-label="表示の切り替え">
    <button id="tabEdit" aria-pressed="true">切り分け</button>
    <button id="tabBox" aria-pressed="false">立体</button>
  </div>
</header>

<main>
  <section class="pane" id="edit" aria-label="切り分け">
    <div class="canvas-wrap"><canvas id="paint" aria-label="画像。タップやなぞりで、選んだ層に入れる部分を指定します"></canvas></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="道具">
        <button data-tool="sam" aria-pressed="false" disabled>物体</button>
        <button data-tool="wand" aria-pressed="true">色</button>
        <button data-tool="brush" aria-pressed="false">なぞる</button>
        <button data-tool="erase" aria-pressed="false">消す</button>
      </div>
      <label class="amount"><span id="amountLabel">色の近さ</span><input id="amount" type="range" min="8" max="120" value="38"></label>
      <button id="undoBtn" disabled>元に戻す</button>
    </div>
    <p class="hint" id="hint">層を選んでから、その層に入れたい部分をタップします。</p>
    <p class="hint" id="ai" role="status">AI：モデルを読み込み中…</p>
    <div class="layers">
      <div class="layers-head">
        <span>上が手前</span>
        <select id="autoN" aria-label="自動で分ける層の数">
          <option value="2">2層まで</option><option value="3" selected>3層まで</option><option value="4">4層まで</option><option value="5">5層まで</option><option value="6">6層まで</option>
        </select>
        <button id="autoBtn">自動で分ける</button>
        <button id="addBtn">層を足す</button>
      </div>
      <div id="list"></div>
    </div>
  </section>

  <section class="pane" id="view3d" aria-label="立体">
    <div class="stage-wrap"><canvas id="stage" aria-label="重ねた層の立体表示。ドラッグで傾けられます"></canvas>
      <div id="err">3D表示を開始できませんでした。WebGLが使えるブラウザで開いてください。</div></div>
    <div class="gapbar"><label for="gap">層の間隔</label><input id="gap" type="range" min="0" max="0.5" step="0.005" value="0.22"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = function(id){ return document.getElementById(id); };
const COLORS = ['#e0564a','#e8a530','#4fae5b','#3c9bd6','#8a63d2','#d85fa3','#3fb8a8','#9a7b4f'];
const MAX_LAYERS = 8, LABEL_MAX = 768, TEX_MAX = 1024;

/* ---------- 状態 ---------- */
const S = {
  tex:null,            // 3D用の画像（canvas）
  small:null,          // 切り分け用に縮めた画像（canvas）
  px:null,             // small の RGBA
  LW:0, LH:0,
  labels:null,         // 各画素がどの層か（0 = 土台だけ）
  layers:[],           // 奥 → 手前。{id,color}
  active:0, nextId:1,
  tool:'wand', tol:38, size:16, pick:0,
  undo:[]
};
let structDirty = true, maskDirty = true, dirtyAt = 0;

function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function freeColor(){
  for(const c of COLORS){ if(!S.layers.some(function(l){return l.color===c;})) return c; }
  return COLORS[0];
}
function addLayer(){
  if(S.layers.length >= MAX_LAYERS) return null;
  const l = {id:S.nextId++, color:freeColor()};
  S.layers.push(l); S.active = l.id; structDirty = true;
  return l;
}
function pushUndo(){
  S.undo.push({labels:S.labels.slice(), layers:S.layers.map(function(l){return {id:l.id,color:l.color};}), active:S.active});
  if(S.undo.length > 12) S.undo.shift();
  $('undoBtn').disabled = false;
}
function undo(){
  const u = S.undo.pop(); if(!u) return;
  S.labels = u.labels; S.layers = u.layers; S.active = u.active;
  $('undoBtn').disabled = !S.undo.length;
  structDirty = true; maskDirty = true; renderList(); drawPaint();
}

/* ---------- 画像の読み込み ---------- */
function fit(w,h,max){ const s = Math.min(1, max/Math.max(w,h)); return [Math.max(1,Math.round(w*s)), Math.max(1,Math.round(h*s))]; }
function setImage(src){   // src: canvas か img
  const w = src.naturalWidth||src.width, h = src.naturalHeight||src.height;
  const t = fit(w,h,TEX_MAX), s = fit(w,h,LABEL_MAX);
  S.tex = document.createElement('canvas'); S.tex.width=t[0]; S.tex.height=t[1];
  const tc = S.tex.getContext('2d'); tc.imageSmoothingQuality='high'; tc.drawImage(src,0,0,t[0],t[1]);
  S.small = document.createElement('canvas'); S.small.width=s[0]; S.small.height=s[1];
  const scx = S.small.getContext('2d'); scx.imageSmoothingQuality='high'; scx.drawImage(src,0,0,s[0],s[1]);
  S.LW=s[0]; S.LH=s[1];
  S.px = scx.getImageData(0,0,s[0],s[1]).data;
  S.labels = new Uint8Array(s[0]*s[1]);
  S.layers = []; S.nextId = 1; S.active = 0; S.undo = []; $('undoBtn').disabled = true;
  const pc = $('paint'); pc.width=s[0]; pc.height=s[1];
  structDirty = true; maskDirty = true;
  aiEmbed();
}

/* ---------- 自動で分ける ----------
   色でまとまりを作り、「背景から数えて何重に囲まれているか」で層を決める。
   背景=土台、背景に接するもの=1層目、その内側にあるもの=2層目…… */
function autoSplit(maxDepth){
  const W=S.LW,H=S.LH,N=W*H,k=12;
  // 紙のざらつきのような細かい模様で分かれないよう、色を見る前に少しぼかす
  let px=S.px;
  for(let pass=0;pass<2;pass++){ const o=new Uint8ClampedArray(px.length);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ let r=0,g=0,b=0,n=0;
      for(let dy=-1;dy<=1;dy++){ const yy=y+dy; if(yy<0||yy>=H) continue;
        for(let dx=-1;dx<=1;dx++){ const xx=x+dx; if(xx<0||xx>=W) continue; const i=(yy*W+xx)*4; r+=px[i]; g+=px[i+1]; b+=px[i+2]; n++; } }
      const i=(y*W+x)*4; o[i]=r/n; o[i+1]=g/n; o[i+2]=b/n; }
    px=o; }
  let seed = 12345; function rnd(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
  const step = Math.max(1,Math.floor(N/20000)), samp=[];
  for(let i=0;i<N;i+=step) samp.push(i);
  const cen=[]; const first=samp[Math.floor(rnd()*samp.length)];
  cen.push([px[first*4],px[first*4+1],px[first*4+2]]);
  const d2=new Float32Array(samp.length).fill(1e12);
  while(cen.length<k){
    const c=cen[cen.length-1]; let sum=0;
    for(let j=0;j<samp.length;j++){ const i=samp[j]*4; const d=(px[i]-c[0])**2+(px[i+1]-c[1])**2+(px[i+2]-c[2])**2; if(d<d2[j]) d2[j]=d; sum+=d2[j]; }
    let r=rnd()*sum, pick=samp.length-1;
    for(let j=0;j<samp.length;j++){ r-=d2[j]; if(r<=0){ pick=j; break; } }
    const i=samp[pick]*4; cen.push([px[i],px[i+1],px[i+2]]);
  }
  function nearest(i){ let b=0,bd=1e12; for(let c=0;c<k;c++){ const d=(px[i]-cen[c][0])**2+(px[i+1]-cen[c][1])**2+(px[i+2]-cen[c][2])**2; if(d<bd){bd=d;b=c;} } return b; }
  for(let it=0;it<10;it++){
    const acc=[]; for(let c=0;c<k;c++) acc.push([0,0,0,0]);
    for(let j=0;j<samp.length;j++){ const i=samp[j]*4,c=nearest(i); acc[c][0]+=px[i];acc[c][1]+=px[i+1];acc[c][2]+=px[i+2];acc[c][3]++; }
    for(let c=0;c<k;c++) if(acc[c][3]) cen[c]=[acc[c][0]/acc[c][3],acc[c][1]/acc[c][3],acc[c][2]/acc[c][3]];
  }
  // ほとんど同じ色のグループは1つにまとめる
  const root=[]; for(let c=0;c<k;c++) root.push(c);
  function find(c){ while(root[c]!==c) c=root[c]; return c; }
  for(let a=0;a<k;a++) for(let b=a+1;b<k;b++){
    const d=Math.sqrt((cen[a][0]-cen[b][0])**2+(cen[a][1]-cen[b][1])**2+(cen[a][2]-cen[b][2])**2);
    if(d<36) root[find(b)]=find(a); }
  let lab=new Uint8Array(N);
  for(let p=0;p<N;p++) lab[p]=find(nearest(p*4));
  // ざらつきや細かい点を消す（周囲で一番多い色に合わせる）
  for(let pass=0;pass<2;pass++){
    const out=new Uint8Array(N), cnt=new Uint16Array(k);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      cnt.fill(0);
      for(let dy=-2;dy<=2;dy++){ const yy=y+dy; if(yy<0||yy>=H) continue;
        for(let dx=-2;dx<=2;dx++){ const xx=x+dx; if(xx<0||xx>=W) continue; cnt[lab[yy*W+xx]]++; } }
      let b=0; for(let c=1;c<k;c++) if(cnt[c]>cnt[b]) b=c;
      out[y*W+x]=b;
    }
    lab=out;
  }
  // つながった同色のかたまりに番号を振る
  const comp=new Int32Array(N).fill(-1), q=new Int32Array(N); let nc=0; const area=[];
  for(let s=0;s<N;s++){ if(comp[s]>=0) continue;
    const c=lab[s]; let h=0,tl=0; q[tl++]=s; comp[s]=nc;
    while(h<tl){ const p=q[h++], x=p%W;
      if(x>0 && comp[p-1]<0 && lab[p-1]===c){ comp[p-1]=nc; q[tl++]=p-1; }
      if(x<W-1 && comp[p+1]<0 && lab[p+1]===c){ comp[p+1]=nc; q[tl++]=p+1; }
      if(p>=W && comp[p-W]<0 && lab[p-W]===c){ comp[p-W]=nc; q[tl++]=p-W; }
      if(p<N-W && comp[p+W]<0 && lab[p+W]===c){ comp[p+W]=nc; q[tl++]=p+W; } }
    area.push(tl); nc++; }
  // かたまりの太さ（縁からの距離の最大）を測り、細すぎる・小さすぎるものは隣に吸収
  const dist=new Uint16Array(N).fill(60000);
  for(let p=0;p<N;p++){ const x=p%W, c=comp[p];
    if((x>0&&comp[p-1]!==c)||(x<W-1&&comp[p+1]!==c)||(p>=W&&comp[p-W]!==c)||(p<N-W&&comp[p+W]!==c)) dist[p]=1; }
  for(let p=0;p<N;p++){ const x=p%W; let d=dist[p]; if(x>0&&dist[p-1]+1<d) d=dist[p-1]+1; if(p>=W&&dist[p-W]+1<d) d=dist[p-W]+1; dist[p]=d; }
  for(let p=N-1;p>=0;p--){ const x=p%W; let d=dist[p]; if(x<W-1&&dist[p+1]+1<d) d=dist[p+1]+1; if(p<N-W&&dist[p+W]+1<d) d=dist[p+W]+1; dist[p]=d; }
  const thick=new Uint16Array(nc);
  for(let p=0;p<N;p++){ const c=comp[p]; if(dist[p]>thick[c]) thick[c]=dist[p]; }
  const minArea=N*0.0003, strong=new Uint8Array(nc); let anyStrong=false;
  for(let c=0;c<nc;c++){ if(thick[c]>=3 && area[c]>=minArea){ strong[c]=1; anyStrong=true; } }
  if(anyStrong){
    let h=0,tl=0;
    for(let p=0;p<N;p++) if(strong[comp[p]]) q[tl++]=p;
    while(h<tl){ const p=q[h++], x=p%W, c=comp[p];
      if(x>0 && !strong[comp[p-1]]){ comp[p-1]=c; q[tl++]=p-1; }
      if(x<W-1 && !strong[comp[p+1]]){ comp[p+1]=c; q[tl++]=p+1; }
      if(p>=W && !strong[comp[p-W]]){ comp[p-W]=c; q[tl++]=p-W; }
      if(p<N-W && !strong[comp[p+W]]){ comp[p+W]=c; q[tl++]=p+W; } }
  }
  // 隣り合うかたまりを調べ、画像の縁に一番多く接するものを背景とする
  const border=new Float64Array(nc), adj=[]; for(let c=0;c<nc;c++) adj.push(null);
  function link(a,b){ if(a===b) return; (adj[a]||(adj[a]=new Set())).add(b); (adj[b]||(adj[b]=new Set())).add(a); }
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const p=y*W+x, c=comp[p];
    if(x===0||y===0||x===W-1||y===H-1) border[c]++;
    if(x<W-1) link(c,comp[p+1]); if(y<H-1) link(c,comp[p+W]); }
  let bg=0; for(let c=1;c<nc;c++) if(border[c]>border[bg]) bg=c;
  const depth=new Int32Array(nc).fill(-1); depth[bg]=0; const bq=[bg]; let deepest=0;
  for(let h=0;h<bq.length;h++){ const c=bq[h]; if(!adj[c]) continue;
    adj[c].forEach(function(n){ if(depth[n]<0){ depth[n]=Math.min(maxDepth,depth[c]+1); if(depth[n]>deepest) deepest=depth[n]; bq.push(n); } }); }
  S.layers=[]; const ids=[0];
  for(let d=1;d<=deepest;d++){ const l=addLayer(); ids.push(l?l.id:0); }
  for(let p=0;p<N;p++){ const d=depth[comp[p]]; S.labels[p]= d>0 ? ids[d] : 0; }
  S.active = S.layers.length ? S.layers[S.layers.length-1].id : 0;
  structDirty=true; maskDirty=true;
}

/* ---------- 塗り分け ---------- */
function flood(x0,y0,tol,id){
  const W=S.LW,H=S.LH,px=S.px,seen=new Uint8Array(W*H),stack=new Int32Array(W*H);
  const s=(y0*W+x0)*4, r=px[s],g=px[s+1],b=px[s+2], t2=tol*tol;
  let n=0; stack[n++]=y0*W+x0; seen[y0*W+x0]=1;
  while(n){
    const p=stack[--n]; S.labels[p]=id;
    const x=p%W, y=(p-x)/W;
    const nb=[x>0?p-1:-1, x<W-1?p+1:-1, y>0?p-W:-1, y<H-1?p+W:-1];
    for(let q=0;q<4;q++){ const m=nb[q]; if(m<0||seen[m]) continue; seen[m]=1;
      const i=m*4, d=(px[i]-r)**2+(px[i+1]-g)**2+(px[i+2]-b)**2;
      if(d<=t2) stack[n++]=m; }
  }
}
function dab(cx,cy,rad,id){
  const W=S.LW,H=S.LH,r2=rad*rad;
  for(let y=Math.max(0,Math.floor(cy-rad));y<=Math.min(H-1,Math.ceil(cy+rad));y++)
    for(let x=Math.max(0,Math.floor(cx-rad));x<=Math.min(W-1,Math.ceil(cx+rad));x++)
      if((x-cx)**2+(y-cy)**2<=r2) S.labels[y*W+x]=id;
}
function stroke(a,b,rad,id){
  const d=Math.hypot(b[0]-a[0],b[1]-a[1]), n=Math.max(1,Math.ceil(d/Math.max(1,rad/2)));
  for(let i=0;i<=n;i++) dab(a[0]+(b[0]-a[0])*i/n, a[1]+(b[1]-a[1])*i/n, rad, id);
}

const paint=$('paint'), pctx=paint.getContext('2d');
let overlay=null;
function drawPaint(){
  if(!S.small) return;
  const W=S.LW,H=S.LH;
  if(!overlay||overlay.width!==W||overlay.height!==H){ overlay=document.createElement('canvas'); overlay.width=W; overlay.height=H; }
  const octx=overlay.getContext('2d'), im=octx.createImageData(W,H), d=im.data;
  const lut={}; S.layers.forEach(function(l){ lut[l.id]=hexRGB(l.color); });
  for(let p=0;p<W*H;p++){
    const id=S.labels[p]; if(!id) continue; const c=lut[id]; if(!c) continue;
    const i=p*4; d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]= id===S.active ? 150 : 70;
  }

function fitPaint(){   // 画像の縦横比を保って枠に収める

  paint.style.width=cw+'px'; paint.style.height=ch+'px';
  paint.style.left=((w-cw)/2)+'px'; paint.style.top=((h-ch)/2)+'px'; paint.style.right='auto'; paint.style.bottom='auto';
}
function toLabel(e){
  const r=paint.getBoundingClientRect();

let painting=false, last=null;

/* ---------- AI（Segment Anything）で物体を選ぶ ----------
   モデルはブラウザの中で動く。画像は外に送られない。
   初回はモデル（約15MB）を読み込み、以降はブラウザに保存される。 */
const AI_LIB='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/dist/transformers.min.js';
const AI_MODEL='Xenova/slimsam-77-uniform';
const AI={T:null, model:null, processor:null, inputs:null, emb:null, ticket:0, busy:false};
function aiSay(s){ $('ai').textContent='AI：'+s; }
function aiEmbed(){
  if(!AI.model||!S.small) return;
  const ticket=++AI.ticket; AI.emb=null; AI.inputs=null;
  aiSay('画像を解析中…（数秒〜数十秒）');
  setTimeout(async function(){
    try{
      const img=AI.T.RawImage.fromCanvas(S.small).rgb();
      const inputs=await AI.processor(img);
      const emb=await AI.model.get_image_embeddings(inputs);
      if(ticket!==AI.ticket) return;
      AI.inputs=inputs; AI.emb=emb;
      aiSay('準備できました。「物体」でタップすると輪郭を選びます。');
    }catch(err){ console.error(err); if(ticket===AI.ticket) aiSay('この画像の解析に失敗しました。「色」「なぞる」は使えます。'); }
  },60);
}
async function aiPick(x,y){
  if(!AI.emb){ aiSay(AI.model?'まだ解析中です。少し待ってからタップしてください。':'使えません。「色」「なぞる」を使ってください。'); return; }
  if(AI.busy) return;
  AI.busy=true;
  try{
    if(!S.layers.some(function(l){return l.id===S.active;})){ if(!addLayer()){ AI.busy=false; return; } renderList(); }
    const rs=AI.inputs.reshaped_input_sizes[0];        // [高さ, 幅]
    const pts=new AI.T.Tensor('float32',new Float32Array([x/S.LW*rs[1], y/S.LH*rs[0]]),[1,1,1,2]);
    const lbl=new AI.T.Tensor('int64',new BigInt64Array([BigInt(1)]),[1,1,1]);
    const out=await AI.model(Object.assign({},AI.emb,{input_points:pts,input_labels:lbl}));
    const masks=await AI.processor.post_process_masks(out.pred_masks,AI.inputs.original_sizes,AI.inputs.reshaped_input_sizes);
    const m=masks[0], H=m.dims[m.dims.length-2], W=m.dims[m.dims.length-1], n=m.dims[m.dims.length-3];
    if(W!==S.LW||H!==S.LH) throw new Error('mask size');
    // 候補は小さい順に3つ。「自動」は確からしさが一番高いもの
    let idx=0;
    if(S.pick>0){ idx=Math.min(n-1,S.pick-1); }
    else{ const sc=out.iou_scores.data; for(let i=1;i<n;i++) if(sc[i]>sc[idx]) idx=i; }
    pushUndo();
    const off=idx*W*H, d=m.data; let count=0;
    for(let p=0;p<W*H;p++) if(d[off+p]){ S.labels[p]=S.active; count++; }
    maskDirty=true; drawPaint();
    aiSay(count?'選びました。違う範囲なら「元に戻す」で取り消し、「大きさ」を変えてもう一度。':'何も選べませんでした。別の場所をタップしてください。');
  }catch(err){ console.error(err); aiSay('選択に失敗しました。もう一度タップしてください。'); }
  AI.busy=false;
}
function aiLoad(){
  import(AI_LIB).then(async function(T){
    const seen={};
    function prog(p){ if(p&&p.status==='progress'&&p.total){ seen[p.file]=[p.loaded,p.total]; let a=0,b=0; for(const k in seen){ a+=seen[k][0]; b+=seen[k][1]; } aiSay('モデルを読み込み中… '+Math.round(a/b*100)+'%（初回のみ）'); } }
    const model=await T.SamModel.from_pretrained(AI_MODEL,{progress_callback:prog});
    const processor=await T.AutoProcessor.from_pretrained(AI_MODEL);
    AI.T=T; AI.model=model; AI.processor=processor;
    document.querySelector('[data-tool="sam"]').disabled=false;
    if(!toolTouched) setTool('sam');
    aiEmbed();
  }).catch(function(err){
    console.error(err);
    aiSay('読み込めませんでした。「色」「なぞる」「自動で分ける」は使えます。');
  });
}

const stage=$('stage');

/* 1つの層の形と絵を作る。
   手前の層に隠れる部分まで形を広げ、そこは周りの色で埋める。
   こうすると、傾けたとき下に同じ絵が二重に見えない。 */
function layerAssets(i, ord){
  const W=S.LW,H=S.LH,N=W*H,lb=S.labels,px=S.px;
  const ext=new Uint8Array(N);          // 1=この層そのもの 2=広げた部分
  let own=0; for(let p=0;p<N;p++) if(ord[lb[p]]===i){ ext[p]=1; own++; }
  const seen=new Uint8Array(N), q=new Int32Array(N); let filled=0;
  if(own) for(let s=0;s<N;s++){ if(ext[s]||seen[s]) continue;
    let h=0,tl=0,lower=false; q[tl++]=s; seen[s]=1;
    while(h<tl){ const p=q[h++], x=p%W; if(ord[lb[p]]<i) lower=true;
      if(x>0 && !ext[p-1] && !seen[p-1]){ seen[p-1]=1; q[tl++]=p-1; }
      if(x<W-1 && !ext[p+1] && !seen[p+1]){ seen[p+1]=1; q[tl++]=p+1; }
      if(p>=W && !ext[p-W] && !seen[p-W]){ seen[p-W]=1; q[tl++]=p-W; }
      if(p<N-W && !ext[p+W] && !seen[p+W]){ seen[p+W]=1; q[tl++]=p+W; } }
    if(!lower){ for(let j=0;j<tl;j++) ext[q[j]]=2; filled+=tl; } }
  // 形（縁を少しなめらかに）。3D用に上下を反転して入れる
  let a=new Uint8Array(N); for(let p=0;p<N;p++) a[p]=ext[p]?255:0;
  for(let pass=0;pass<2;pass++){ const b=new Uint8Array(N);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ let s=0,n=0;
      for(let dy=-1;dy<=1;dy++){ const yy=y+dy; if(yy<0||yy>=H) continue;
        for(let dx=-1;dx<=1;dx++){ const xx=x+dx; if(xx<0||xx>=W) continue; n++; s+=a[yy*W+xx]; } }
      b[y*W+x]=s/n; }
    a=b; }
  const mask=new Uint8Array(N); for(let y=0;y<H;y++) mask.set(a.subarray(y*W,y*W+W),(H-1-y)*W);
  if(!filled || !own) return {mask:mask, canvas:null, full:own===N};
  // 埋める範囲：広げた部分＋その境目の少し外側
  const tgt=new Uint8Array(N); for(let p=0;p<N;p++) if(ext[p]===2) tgt[p]=1;
  for(let pass=0;pass<3;pass++){ const add=[];
    for(let p=0;p<N;p++){ if(ext[p]!==1||tgt[p]) continue; const x=p%W;
      if((x>0&&tgt[p-1])||(x<W-1&&tgt[p+1])||(p>=W&&tgt[p-W])||(p<N-W&&tgt[p+W])) add.push(p); }
    for(let j=0;j<add.length;j++) tgt[add[j]]=1; }
  // いちばん近い「この層の色」を広げていく
  const src=new Int32Array(N).fill(-1); let h=0,tl=0;
  for(let p=0;p<N;p++) if(ext[p]===1 && !tgt[p]){ src[p]=p; q[tl++]=p; }
  if(!tl) return {mask:mask, canvas:null, full:false};
  while(h<tl){ const p=q[h++], x=p%W, s=src[p];
    if(x>0 && tgt[p-1] && src[p-1]<0){ src[p-1]=s; q[tl++]=p-1; }
    if(x<W-1 && tgt[p+1] && src[p+1]<0){ src[p+1]=s; q[tl++]=p+1; }
    if(p>=W && tgt[p-W] && src[p-W]<0){ src[p-W]=s; q[tl++]=p-W; }
    if(p<N-W && tgt[p+W] && src[p+W]<0){ src[p+W]=s; q[tl++]=p+W; } }
  let col=new Uint8ClampedArray(N*4);
  for(let p=0;p<N;p++){ const s=src[p]<0?p:src[p]; col[p*4]=px[s*4]; col[p*4+1]=px[s*4+1]; col[p*4+2]=px[s*4+2]; }
  for(let pass=0;pass<4;pass++){ const o=new Uint8ClampedArray(col);
    for(let p=0;p<N;p++){ if(!tgt[p]) continue; const x=p%W; let r=col[p*4],g=col[p*4+1],b=col[p*4+2],n=1;
      if(x>0&&ext[p-1]){ r+=col[p*4-4]; g+=col[p*4-3]; b+=col[p*4-2]; n++; }
      if(x<W-1&&ext[p+1]){ r+=col[p*4+4]; g+=col[p*4+5]; b+=col[p*4+6]; n++; }
      if(p>=W&&ext[p-W]){ const m=(p-W)*4; r+=col[m]; g+=col[m+1]; b+=col[m+2]; n++; }
      if(p<N-W&&ext[p+W]){ const m=(p+W)*4; r+=col[m]; g+=col[m+1]; b+=col[m+2]; n++; }
      o[p*4]=r/n; o[p*4+1]=g/n; o[p*4+2]=b/n; }
    col=o; }
  for(let p=0;p<N;p++) col[p*4+3]=tgt[p]?255:0;
  const oc=document.createElement('canvas'); oc.width=W; oc.height=H; oc.getContext('2d').putImageData(new ImageData(col,W,H),0,0);
  const c=document.createElement('canvas'); c.width=S.tex.width; c.height=S.tex.height;
  const g=c.getContext('2d'); g.drawImage(S.tex,0,0); g.imageSmoothingQuality='high'; g.drawImage(oc,0,0,c.width,c.height);
  return {mask:mask, canvas:c, full:false};
}
function rebuild(){
  if(!renderer||!S.tex) return;
  clearBox();
  const long=8.7, ar=S.tex.width/S.tex.height;
  if(ar<=1){ PH=long; PW=long*ar; } else { PW=long; PH=long/ar; }
  const gl2=renderer.capabilities.isWebGL2, aniso=renderer.capabilities.getMaxAnisotropy();
  function colorTexture(cv){ const tx=new THREE.CanvasTexture(cv); tx.encoding=THREE.sRGBEncoding;
    tx.generateMipmaps=gl2; tx.minFilter=gl2?THREE.LinearMipmapLinearFilter:THREE.LinearFilter; tx.anisotropy=aniso; return tx; }
  const plane=new THREE.PlaneGeometry(PW,PH);
  const ord=new Int32Array(256); S.layers.forEach(function(l,j){ ord[l.id]=j+1; });
  for(let i=0;i<=S.layers.length;i++){
    const A=layerAssets(i,ord);
    const map=colorTexture(A.canvas||S.tex);
    let mask=null;
    if(i>0){ mask=new THREE.DataTexture(A.mask,S.LW,S.LH,THREE.LuminanceFormat);
      mask.magFilter=THREE.LinearFilter; mask.minFilter=THREE.LinearFilter; mask.generateMipmaps=false; mask.needsUpdate=true; }
    const g=new THREE.Group();
    const coreMat=new THREE.MeshStandardMaterial({color:lin(0xcfc7b6),roughness:0.95});
    if(mask){ coreMat.alphaMap=mask; coreMat.alphaTest=0.5; }
    for(let k=PAPER;k>=1;k--){ const c=new THREE.Mesh(plane,coreMat); c.position.z=-k*PAPER_T; c.receiveShadow=true; g.add(c); }
    const mat=new THREE.MeshStandardMaterial({map:map,roughness:0.62});
    if(mask){ mat.alphaMap=mask; mat.alphaTest=0.5; }
    mat.shadowSide=THREE.DoubleSide;
    const top=new THREE.Mesh(plane,mat); top.castShadow=true; top.receiveShadow=true;
    const dm=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,side:THREE.DoubleSide});
    if(mask){ dm.alphaMap=mask; dm.alphaTest=0.5; }
    top.customDepthMaterial=dm;
    g.add(top); box.add(g);
    layerMeshes.push({group:g});
  }
  fitW=PW+2.6; fitH=PH+2.0;
  structDirty=false; maskDirty=false;
  applyGap(); resize3D();
}
function applyGap(){
  if(!renderer) return;
  const gap=parseFloat($('gap').value);
  layerMeshes.forEach(function(m,i){ m.group.position.z=BASE_Z+PAPER*PAPER_T+i*gap; });
  box.position.z=-(BASE_Z+Math.max(1,layerMeshes.length-1)*gap)/2;
}
$('gap').addEventListener('input',applyGap);
function resize3D(){
  if(!renderer) return;
  const wrap=stage.parentElement, w=wrap.clientWidth, h=wrap.clientHeight;
  if(!w||!h) return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  const t=Math.tan(camera.fov*Math.PI/360), d=Math.max(fitH/2/t, fitW/2/t/camera.aspect);
  camera.position.set(0,0,d); camera.lookAt(0,0,0); camera.updateProjectionMatrix();
}
window.addEventListener('resize',function(){ fitPaint(); resize3D(); });

const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let tx=-0.08,ty=0.38,rx=0,ry=0,drag=false,dx=0,dy=0,lastTouch=-1e9;
stage.addEventListener('pointerdown',function(e){ drag=true; dx=e.clientX; dy=e.clientY; try{stage.setPointerCapture(e.pointerId);}catch(_){ } });
stage.addEventListener('pointermove',function(e){
  if(!drag) return; const s=2.2/Math.min(stage.clientWidth,stage.clientHeight);
  ty=Math.max(-0.75,Math.min(0.75,ty+(e.clientX-dx)*s)); tx=Math.max(-0.5,Math.min(0.5,tx+(e.clientY-dy)*s)); dx=e.clientX; dy=e.clientY; });
function endDrag(){ if(drag){ drag=false; lastTouch=performance.now(); } }
stage.addEventListener('pointerup',endDrag); stage.addEventListener('pointercancel',endDrag);

function loop(now){
  requestAnimationFrame(loop);
  if(!renderer||!stage.parentElement.clientWidth) return;   // 立体が隠れている間は描かない
  if(structDirty||maskDirty){ if(!dirtyAt) dirtyAt=now; if(!painting && now-dirtyAt>250){ dirtyAt=0; rebuild(); } }
  if(!reduce && !drag && now-lastTouch>3500){ const t=now/1000; ty+=(Math.sin(t*0.45)*0.42-ty)*0.02; tx+=(Math.sin(t*0.31)*0.12-0.05-tx)*0.02; }
  ry+=(ty-ry)*0.12; rx+=(tx-rx)*0.12; box.rotation.set(rx,ry,0);
  renderer.render(scene,camera);
}

/* ---------- 開始 ---------- */
init3D();
demo();
renderList(); setTool('wand'); fitPaint(); drawPaint();
aiLoad();
if(window.ResizeObserver){ new ResizeObserver(function(){ fitPaint(); resize3D(); }).observe(document.querySelector('main')); }
requestAnimationFrame(loop);
window.__S=S;
})();
</script>
